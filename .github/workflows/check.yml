name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frontmatter, field notes, personal paths, secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/check_skills.py --base "origin/${{ github.base_ref }}"
          else
            python3 tools/check_skills.py
          fi
